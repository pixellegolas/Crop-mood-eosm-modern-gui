name: Build EOS M Obsidian
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi make
      - name: Build EOS M
        run: |
          make -C platform/EOSM.202 -j4
          make -C platform/EOSM.202 zip
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: magiclantern-obsidian-EOSM202
          path: platform/EOSM.202/magiclantern-*.zip
